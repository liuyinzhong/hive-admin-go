info:
  contact: {}
  description: Hive Admin Go 后端 API 接口文档。受认证业务接口依次执行原子接口权限与数据权限；具体记录范围以角色 dataScope、当前用户部门和领域归属为准。
  title: Hive Admin API
  version: "1.0"
paths:
  /auth/codes:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的权限码列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: 用户未登录
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户权限码
      tags:
      - 认证管理
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户通过用户名和密码登录
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.LoginResponse'
              type: object
        "401":
          description: 用户名或密码错误
          schema:
            additionalProperties: true
            type: object
      summary: 用户登录
      tags:
      - 认证管理
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 用户登出系统
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: 用户未登录
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 用户登出
      tags:
      - 认证管理
  /auth/menus:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的菜单权限
      produces:
