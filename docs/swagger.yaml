  /system/operationLogs:
    get:
      description: 按日志用户和当前角色数据范围分页查询操作日志。未传时间范围时默认查询最近 7 天数据；日志表保留 180 天，超期会被物理删除。
      parameters:
      - default: 1
        description: 页码，默认 1
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页大小，默认 20，最大 100
        in: query
        name: pageSize
        type: integer
      - description: 用户名，模糊匹配
        in: query
        name: username
        type: string
      - description: 请求 URL，模糊匹配
        in: query
        name: requestUrl
        type: string
      - description: 请求方法，精确匹配（自动转大写），例如 GET、POST、PUT、DELETE
        in: query
        name: requestMethod
        type: string
      - description: 操作状态：0 失败，1 成功；传非 0/1 返回 400
        enum:
        - 0
        - 1
        in: query
        name: status
        type: integer
      - description: 开始时间，支持格式：YYYY-MM-DD、YYYY-MM-DD HH:mm:ss、RFC3339；不传时默认为当前时间往前
          7 天
        in: query
        name: startDate
        type: string
      - description: 结束时间，支持格式同 startDate；仅传日期时取当天 23:59:59.999；不传时默认为当前时间；不能早于 startDate
        in: query
        name: endDate
        type: string
      - description: 排序，格式 field,desc;field,asc；可排序字段：createDate、durationMs、httpStatus；未传时默认
          createDate desc
        in: query
        name: sorts
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/utils.PageResult'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/models.OperationLogListResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: 参数错误：状态值非法、时间格式不正确或结束时间早于开始时间
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/models.Response'
        "403":
          description: 无接口访问权限
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: 日志查询失败
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取操作日志列表
      tags:
      - 系统管理/日志管理
